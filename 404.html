<style>
  @keyframes flicker {
    0%, 100% { opacity: .1; }
    42% { opacity: .1; }

    52% { opacity: .32; }
    54% { opacity: .1; }

  @keyframes emberRise {
    from { transform: translateY(0) scale(1); opacity: 0; }
    12% { opacity: .7; }
    to { transform: translateY(-160px) scale(.4); opacity: 0; }

  .e404-num { animation: flicker 7s ease-in-out infinite; }
  .e404-cta:hover { background: #b5544e !important; transform: translateY(-3px); }
  .e404-ghost:hover { border-color: rgba(255,255,255,.45) !important; color: #f6f3ed !important; }
  .e404-link:hover { color: #f2efe9 !important; }
  @media (max-width: 720px) { .e404-num { font-size: 34vw !important; } }
</style>
</head>

<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var host = document.getElementById('embers');
  if (!host) return;
  for (var i = 0; i < 14; i++) {
    var s = document.createElement('span');
    var size = 1 + Math.random() * 2;
    s.style.cssText = 'position:absolute; bottom:' + (Math.random() * 30) + '%; left:' + (Math.random() * 100) + '%; width:' + size + 'px; height:' + size + 'px; border-radius:50%; background:#c9776d; animation:emberRise ' + (9 + Math.random() * 10).toFixed(1) + 's linear ' + (Math.random() * 12).toFixed(1) + 's infinite';

})();
