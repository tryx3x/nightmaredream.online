<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nightmare Dream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #1e1e1e;
      --text: #e9e7e2;
      --muted: #9a978f;
      --accent: #cbb9a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Cardo, Georgia, "Times New Roman", serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px;
    }
    header .brand { font-style: italic; font-size: 1.25rem; }
    header nav { font-size: 1.05rem; }

    .hero {
      min-height: 42vh;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .hero svg { width: 260px; max-width: 60vw; opacity: .9; }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 32px 120px;
    }
    h1 {
      font-weight: 400;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: -0.01em;
      margin-bottom: 28px;
    }
    main p { font-size: 1.2rem; color: var(--text); margin-bottom: 32px; }
    .date { color: var(--muted); font-style: italic; font-size: 1rem; }

    footer {
      border-top: 1px solid #2a2a2a;
      text-align: center;
      padding: 40px 32px;
      color: var(--muted);
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Nightmare Dream</div>
    <nav><a href="#post">Sample Page</a></nav>
  </header>

  <section class="hero" aria-hidden="true">
    <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 110 C 60 110, 70 40, 130 40" fill="none" stroke="#cbb9a0" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round"/>
      <path d="M120 40 q 15 -18 40 -14 q -18 6 -18 20 q 14 -6 24 2 q -20 6 -22 18 q -14 -14 -24 -26 z" fill="#e9e7e2"/>
      <circle cx="152" cy="34" r="2.4" fill="#0b0b0b"/>
    </svg>
  </section>

  <main id="post">
    <h1>Hello world!</h1>
    <p>Welcome to my site. This is the first page — soon there will be more here.</p>
    <p class="date">August 29, 2026</p>
  </main>

  <footer>nightmaredream.online</footer>
</body>
</html>
